# spangap-web — HTTPS + auth + WebRTC + the shared browser UI shell.
#
# Browser-side UI activator: when this straddle is in the dep graph (and
# --no-web-ui is not set), the build picks up every other straddle's
# browser/ subdir and includes its init() in the generated browser
# dispatcher. Firmware half holds web/auth/webrtc; browser half holds
# the shared UI shell (FloatingWindow, MenuBar, SettingX, TerminalWindow,
# LogWindow, WebRTC session, auth flow, storage sync, menu registry,
# Pinia stores).
schema_version: 1
name: spangap/spangap-web
prefix: web
version: 0.0.0
firmware: esp-idf
browser: browser
platforms: [idf]
requires:
  - spangap/spangap-net
  # webrtc_task.cpp unconditionally #include's "upnp.h" for external-IP
  # discovery; today that makes upnp a hard dep. Could become an
  # additional_installs entry once the call site is gated on CONFIG_SPANGAP_UPNP.
  - spangap/upnp
# Auto-init: comes up in the generated serviceRunInit() walk, so a
# --no-web build (spangap-web not staged) simply emits no registration — no #if
# CONFIG_SPANGAP_WEB guard in the consumer. web registers in the platform
# band (after core + net, see spangap-inside PLATFORM_ORDER): core's storage
# task and net's IP stack are already up, and webrtc follows webInit in listed
# order.
init:
  - call: webInit
  - call: webrtcInit

# Backup & Recovery, contributed to the System node spangap-net names. No node
# is owned: the rows land beside the hostname and time rows without either
# straddle knowing about the other.
#
# Each of the three is one edge-triggered write that the firmware turns into a
# reboot into safe mode, so each is a `set` with `edge` (the flag may be left
# set by an attempt that did not reboot, and without the edge the next press
# would write a value the key already holds and nothing would happen) and
# `reboots` (the shared wait-and-reload behaviour, instead of per-panel
# choreography). The confirmations are dialogs because there is nothing to type.
settings:
  - at:
      - { id: system, label: "System", order: 1 }
    order: 10
    rows:
      - section: "Backup & Recovery"
      - caption: "Each of these reboots the device into a safe mode that runs the operation with nothing else touching its state, then reboots again. Everything else stays off for the duration."
      - button:
          label: "Back up state"
          do:
            dialog:
              text: "To back up all the user state on this device, it needs to reboot in safe mode, send you the file and reboot again."
              buttons:
                - { label: "Cancel" }
                - label: "Reboot and back up"
                  do: { set: { key: "s.sys.backup", value: 1, edge: true, reboots: true } }
      - button:
          label: "Restore from backup"
          do:
            dialog:
              text: "The device reboots into safe mode and asks for an archive. Everything on its state store — settings, identities, keys, messages — is erased before the archive is written, and there is no way back to what is there now."
              buttons:
                - { label: "Cancel" }
                - label: "Reboot and restore"
                  danger: true
                  do: { set: { key: "s.sys.restore", value: 1, edge: true, reboots: true } }
      # The wipe target is a choice, so it is a dialog of buttons rather than a
      # picker plus a confirm: each button states exactly what it erases.
      - button:
          label: "Factory reset"
          danger: true
          do:
            dialog:
              text: "Every trace of this device's configuration, keys and identity is overwritten with random bytes — not deleted, overwritten, so nothing survives a flash dump. It comes back as a brand-new device on its own access point, and this browser will no longer find it here."
              buttons:
                - { label: "Cancel" }
                - label: "Erase device flash"
                  danger: true
                  do: { set: { key: "s.sys.factory_reset", value: 1, edge: true, reboots: true } }
                - label: "Erase SD card state"
                  danger: true
                  do: { set: { key: "s.sys.factory_reset", value: 2, edge: true, reboots: true } }
                - label: "Erase both"
                  danger: true
                  do: { set: { key: "s.sys.factory_reset", value: 3, edge: true, reboots: true } }
